<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>香盡</title>
<meta name="description" content="中式恐怖密室逃脫：中元夜，在香燒盡之前離開祖父的書齋。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topright">
    <div id="incense" title="香">
      <div class="stick"><div class="burn"></div><div class="ember"></div></div>
      <div class="label"><span>香</span><b id="incense-text">—</b></div>
    </div>
    <button id="btn-hint" class="round" title="提示（香會燒得更快）" aria-label="提示（香會燒得更快）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2v.5h5V16c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button id="btn-sound" class="round" title="聲音" aria-label="關閉聲音">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>

  <div id="tooltip"></div>
  <div id="using"></div>
  <div id="message"></div>

  <div id="inventory">
    <div id="slots"></div>
    <button id="btn-inspect" class="hidden">查看</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="panel">
    <button class="close" aria-label="關閉">✕</button>
    <div class="body"></div>
  </div>
</div>

<div id="title">
  <div class="title-inner">
    <h1>香<span>盡</span></h1>
    <p class="sub">中元夜・祖宅書齋</p>
    <p class="warn">本作含驚嚇畫面、閃爍與突發音效。<br />建議戴上耳機，在暗處遊玩。</p>
    <button id="btn-start" disabled>載入中⋯</button>
    <p class="how">拖曳畫面環顧四周・點擊遠處的家具就會走過去<br />點擊物品調查；先在下方背包選取物品，再點擊目標即可使用</p>
  </div>
</div>

<div id="story" class="hidden"><div class="lines"></div></div>
<div id="flash"></div>

<div id="ending" class="hidden">
  <div class="ending-inner">
    <div class="lines"></div>
    <h2></h2>
    <p class="stats"></p>
    <button id="btn-restart">重新點香</button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
